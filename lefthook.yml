# Local CI guard. Mirrors .github/workflows/ci.yml so broken code never reaches a push.
# Auto-installed via the package.json prepare script on npm install.
pre-commit:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      run: npm run lint
    agent-rules-guard:
      run: |
        if grep -q "nextjs-agent-rules" AGENTS.md CLAUDE.md 2>/dev/null; then
          echo "AGENTS.md carries the block next dev writes when it detects a coding agent. Remove it before committing; the repo owns its own agent instructions."
          exit 1
        fi
pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
      priority: 1
    test:
      run: npm test
      priority: 2
